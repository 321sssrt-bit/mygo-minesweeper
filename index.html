<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyGO!!!!! 迷子扫雷 — 迷子でも進め</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg-rain" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="top-header">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="32" height="32" fill="none">
            <circle cx="18" cy="18" r="15.5" stroke="#55B2D6" stroke-width="2" stroke-dasharray="4 3" />
            <path d="M18 4L21.5 14.5L32 18L21.5 21.5L18 32L14.5 21.5L4 18L14.5 14.5L18 4Z" fill="#55B2D6" fill-opacity="0.22" stroke="#67B7E1" stroke-width="1.6" />
            <circle cx="18" cy="18" r="3" fill="#F8FAFC" />
          </svg>
        </div>
        <div>
          <h1>MyGO!!!!! <span>迷子扫雷</span></h1>
          <p class="subtitle">「迷子でもいい、迷子でも進め。」</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="mode-toggle" class="pill-btn active" type="button" title="切换乐队技能模式 / 纯正经典模式">
          <span class="dot"></span>
          <span id="mode-toggle-label">乐队应援模式</span>
        </button>
        <button id="sound-toggle" class="icon-btn" type="button" title="开关音效" aria-label="开关音效">
          🔊 音效开
        </button>
      </div>
    </header>

    <section class="controls-bar" aria-label="难度与操作设置">
      <div class="difficulty-tabs" role="tablist" aria-label="选择难度">
        <button class="diff-tab active" data-diff="easy" type="button">
          <strong>羽丘中庭</strong>
          <span>9×9 · 10雷</span>
        </button>
        <button class="diff-tab" data-diff="normal" type="button">
          <strong>RiNG Live</strong>
          <span>16×16 · 40雷</span>
        </button>
        <button class="diff-tab" data-diff="hard" type="button">
          <strong>春日影舞台</strong>
          <span>30×16 · 99雷</span>
        </button>
        <button class="diff-tab" data-diff="custom" type="button">
          <strong>自定义</strong>
          <span>自由排练</span>
        </button>
      </div>

      <div id="custom-panel" class="custom-panel hidden">
        <label>宽 <input id="custom-cols" type="number" min="5" max="40" value="12" /></label>
        <label>高 <input id="custom-rows" type="number" min="5" max="30" value="12" /></label>
        <label>雷数 <input id="custom-mines" type="number" min="1" max="300" value="20" /></label>
        <button id="apply-custom" class="small-btn" type="button">开局</button>
      </div>

      <div class="tool-toggles">
        <button id="flag-mode-btn" class="tool-btn" type="button" title="快捷键 F：左键直接插旗">
          🩹 标旗模式：<span id="flag-mode-state">关</span>
        </button>
        <button id="question-mode-btn" class="tool-btn" type="button" title="右键循环是否包含问号标记">
          ❓ 问号：<span id="question-mode-state">关</span>
        </button>
      </div>
    </section>

    <section class="member-panel" aria-label="MyGO成员应援">
      <div class="member-roster" id="member-roster">
        <!-- Populated by main.js -->
      </div>

      <div class="dialogue-card" id="dialogue-card">
        <div class="dialogue-avatar" id="dialogue-avatar"></div>
        <div class="dialogue-body">
          <div class="dialogue-meta">
            <span class="member-name" id="active-member-name">高松灯</span>
            <span class="member-role" id="active-member-role">Vo.</span>
            <span class="skill-tag" id="active-skill-tag">捡来的石头</span>
          </div>
          <p class="dialogue-text" id="dialogue-text">「就算会迷路……也想和大家一起把这片雷区走完。」</p>
        </div>
        <button id="skill-btn" class="skill-btn" type="button">
          <span id="skill-btn-text">发动技能</span>
          <span class="skill-charges" id="skill-charges">×1</span>
        </button>
      </div>
    </section>

    <section class="board-stage" aria-label="扫雷棋盘">
      <div class="hud-bar">
        <div class="hud-counter" title="剩余未标记地雷数">
          <span class="hud-label">MINES</span>
          <span class="hud-digits" id="mines-left">010</span>
        </div>

        <button id="reset-btn" class="reset-btn" type="button" title="重新开始 (快捷键 R)">
          <span id="reset-emoji">🧭</span>
          <span id="reset-text">迷子出发</span>
        </button>

        <div class="hud-right">
          <div class="hud-counter" title="当前用时">
            <span class="hud-label">TIME</span>
            <span class="hud-digits" id="timer-digits">000</span>
          </div>
          <div class="best-badge" id="best-badge" title="当前难度最快纪录">
            BEST <span id="best-time">--</span>
          </div>
        </div>
      </div>

      <div class="grid-scroll">
        <div id="mine-grid" class="mine-grid" role="grid" aria-label="扫雷网格"></div>
      </div>
    </section>

    <footer class="footer-tips">
      <span>左键翻开 · 右键标旗 · 点击已翻开数字可快速周围排雷 (Chord)</span>
      <span>快捷键：<kbd>R</kbd> 重开 · <kbd>F</kbd> 标旗模式 · <kbd>E</kbd> 成员技能</span>
    </footer>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
